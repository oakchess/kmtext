
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Restricted | KM Textiles</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f3f6f9;
      color: #1d2630;
    }

    .message {
      width: 100%;
      max-width: 460px;
      padding: 36px;
      text-align: center;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, .08);
    }

    h1 { color: #3A6578; font-size: 25px; }

    p {
      color: #6b7a88;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 14px;
      padding: 12px 20px;
      color: #fff;
      background: #3A6578;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="message">
    <h1>Access Restricted</h1>
    <p>
      For security purposes, access is limited to company-approved devices. Please sign in using an approved laptop or workstation.    
    </p>

    <p>Contact your system administrator if you require assistance.</p>
    <a href="login.html">Return to Login</a>
  </main>
</body>
</html>
